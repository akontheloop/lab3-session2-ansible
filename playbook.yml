---
- name: Configure infrastructure and automate application
  hosts: webservers
  become: false

  tasks:
    - name: Create application directory
      ansible.builtin.file:
        path: ~/myapp
        state: directory
        mode: '0755'

    - name: Deploy application webpage
      ansible.builtin.copy:
        content: |
          <html>
          <h1>Application deployed using Ansible!</h1>
          <p>Lab 3 Session 2</p>
          </html>
        dest: ~/myapp/index.html
        mode: '0644'

    - name: Verify application file
      ansible.builtin.stat:
        path: ~/myapp/index.html
      register: app_file

    - name: Display deployment status
      ansible.builtin.debug:
        msg: "Application deployment successful!"
      when: app_file.stat.exists
